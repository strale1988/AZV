/* =================================================================
   ICONS (simple generic outline set, no external dependency)
================================================================= */
function icon(name, size, color){
  size = size || 16; color = color || 'currentColor';
  // Custom icons live in icons/<name>.png as white-on-transparent PNGs.
  // Rendered as a CSS mask (not a plain <img>) so `color` can still tint
  // them per-use, the same way the old inline SVGs were tinted.
  const PNG_ICONS = new Set(["wind","newspaper","book","factory","flag","pin","radio","globe","shield","login","logout","plus","trash","chevron","external"]);
  if (PNG_ICONS.has(name)){
    const maskStyle = `-webkit-mask-image:url(icons/${name}.png);mask-image:url(icons/${name}.png);`+
      `-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;`+
      `-webkit-mask-position:center;mask-position:center;`;
    return `<span class="icon" style="display:inline-block;width:${size}px;height:${size}px;flex-shrink:0;background-color:${color};${maskStyle}"></span>`;
  }
  const base = `viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
  const paths = {
    send: `<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>`,
    loader: `<circle cx="12" cy="12" r="9" stroke-dasharray="42" stroke-dashoffset="15"/>`,
  };
  const spinClass = name === 'loader' ? ' class="icon spin"' : ' class="icon"';
  return `<svg ${base}${spinClass}>${paths[name] || ''}</svg>`;
}

/* =================================================================
   LATIN → CYRILLIC TRANSLITERATION
   Content (articles, pollutant descriptions, smell guide, industrial
   sources) is authored once, in Serbian Latin, as the single source of
   truth. When the UI is in Cyrillic mode, srDisplay() transliterates it
   on the fly — Serbian Latin-to-Cyrillic is a mechanical, 1:1 mapping,
   so this keeps both scripts genuinely in sync instead of relying on a
   second hand-maintained copy of every string. Tokens that contain a
   digit (PM10, PM2.5, SO₂...) are left untouched, since chemical
   notation and units conventionally stay in Latin form even inside
   Cyrillic text.
================================================================= */
const LAT2CYR_2 = { "lj":"љ","Lj":"Љ","LJ":"Љ", "nj":"њ","Nj":"Њ","NJ":"Њ", "dž":"џ","Dž":"Џ","DŽ":"Џ" };
const LAT2CYR_1 = {
  a:"а",A:"А", b:"б",B:"Б", v:"в",V:"В", g:"г",G:"Г", d:"д",D:"Д", đ:"ђ",Đ:"Ђ",
  e:"е",E:"Е", ž:"ж",Ž:"Ж", z:"з",Z:"З", i:"и",I:"И", j:"ј",J:"Ј", k:"к",K:"К",
  l:"л",L:"Л", m:"м",M:"М", n:"н",N:"Н", o:"о",O:"О", p:"п",P:"П", r:"р",R:"Р",
  s:"с",S:"С", t:"т",T:"Т", ć:"ћ",Ć:"Ћ", u:"у",U:"У", f:"ф",F:"Ф", h:"х",H:"Х",
  c:"ц",C:"Ц", č:"ч",Č:"Ч", š:"ш",Š:"Ш",
};
function latToCyr(str){
  if (!str) return str;
  return str.split(/(\s+)/).map(token=>{
    if (/[\d\u2080-\u2089]/.test(token)) return token; // keep formulas/units as-is
    let out = "";
    for (let i=0;i<token.length;i++){
      const two = token.substr(i,2);
      if (LAT2CYR_2[two]){ out += LAT2CYR_2[two]; i++; continue; }
      const ch = token[i];
      out += (LAT2CYR_1[ch] !== undefined) ? LAT2CYR_1[ch] : ch;
    }
    return out;
  }).join("");
}
function srDisplay(str){ return state.lang==="sr-cyrl" ? latToCyr(str) : str; }

// reading that's actually on Serbia's DOBAR..IZUZETNO ZAGAĐEN scale.
const SEPA_TO_KEY = {
  "DOBAR":"good", "PRIHVATLJIV":"moderate", "UMEREN":"usg",
  "ZAGAĐEN":"unhealthy", "VEOMA ZAGAĐEN":"vunhealthy", "IZUZETNO ZAGAĐEN":"hazardous",
};
const SEPA_LABELS = {
  "DOBAR":            {"sr-latn":"Dobar",            "sr-cyrl":"Добар",             en:"Good"},

function sepaLabel(cat){ return (SEPA_LABELS[cat] && SEPA_LABELS[cat][state.lang]) || cat || "–"; }
function fmtNum(n){
  if (n==null || isNaN(n)) return "–";
  const rounded = Math.round(n*10)/10;
  return rounded.toString().replace(".", ",");
}
function levelForKey(key){ return AQI_LEVELS.find(l=>l.key===key) || AQI_LEVELS[0]; }
// Demo stations use a numeric 0-500 style AQI; live TraceTheToxin stations
// carry a SEPA category string instead (no numeric score). This handles both.
function levelFor(station){
  if (station.sepaCategory) return levelForKey(SEPA_TO_KEY[station.sepaCategory] || "good");
  return AQI_LEVELS.find(l=>station.aqi<=l.max) || AQI_LEVELS[AQI_LEVELS.length-1];
}
function formatStationTime(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

   "azv-news", public read). Each article can carry several photos;

   is shown, the full set is shown in the expanded article view.

function articleCoverUrl(article){

}

/* =================================================================
   STORAGE — uses window.storage when previewing in Claude,
   falls back to localStorage on a real deployed server.
   NOTE: localStorage is per-browser only. For real shared/admin-wide
   persistence in production, replace this with a real backend/database.
================================================================= */
async function storageGet(key, shared){
  try{
    if (window.storage) return await window.storage.get(key, !!shared);
  }catch(e){ /* not found or unavailable */ }
  try{
    const v = localStorage.getItem(key);
    return v ? {value:v} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  try{
    if (window.storage){ await window.storage.set(key, value, !!shared); return; }
  }catch(e){}
  try{ localStorage.setItem(key, value); }catch(e){}
}

async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById("login-user").value.trim();
  const pass = document.getElementById("login-pass").value;
  state.loginError = ""; render();

  const client = getTttClient();
  const { data, error } = await client.auth.signInWithPassword({ email, password: pass });
  if (error){ state.loginError = t().login_error; render(); return; }

  const { data: adminRow } = await azvAdmins().select("user_id").eq("user_id", data.user.id).maybeSingle();
  if (!adminRow){
    await client.auth.signOut();
    state.loginError = t().login_error; render();
    return;
  }

  state.isAdmin = true; state.currentUser = data.user; state.loginError = "";
  setView("admin-panel");
}

async function doLogout(){
  await getTttClient().auth.signOut();
  state.isAdmin = false; state.currentUser = null;
  setView("home");
}

async function restoreAdminSession(){
  const client = getTttClient();
  const { data: { session } } = await client.auth.getSession();
  if (!session) return;
  const { data: adminRow } = await azvAdmins().select("user_id").eq("user_id", session.user.id).maybeSingle();
  if (adminRow){ state.isAdmin = true; state.currentUser = session.user; }
  else await client.auth.signOut();
}

async function loadArticlesFromSupabase(){
  const { data, error } = await azvNews().select("*").order("created_at", { ascending:false });
  if (error) throw error;
  return (data||[]).map(row=>({
    id: row.id,
    date: (row.created_at||"").slice(0,10),
    title_sr: row.title_sr, excerpt_sr: row.excerpt_sr, body_sr: row.body_sr,
    images: row.images || [],
  }));
}

async function publishArticle(e){
  e.preventDefault();
  const title = document.getElementById("new-title").value.trim();
  const excerpt = document.getElementById("new-excerpt").value.trim();
  const body = document.getElementById("new-body").value.trim();
  const photoInput = document.getElementById("new-photo");
  const files = photoInput && photoInput.files ? [...photoInput.files] : [];
  if (!title) return;

  state.publishing = true; state.publishError = ""; render();
  try{
    const { data, error } = await azvNews()
      .insert({ title_sr:title, excerpt_sr:excerpt, body_sr:body, created_by: state.currentUser ? state.currentUser.id : null })
      .select()
      .single();
    if (error) throw error;

    let images = [];
    if (files.length){
      images = await uploadArticlePhotos(data.id, files);
      const { error: updErr } = await azvNews().update({ images }).eq("id", data.id);
      if (updErr) throw updErr;
    }

    const article = {
      id: data.id, date:(data.created_at||"").slice(0,10),
      title_sr:data.title_sr, excerpt_sr:data.excerpt_sr, body_sr:data.body_sr,
      images,
    };
    state.articles = [article, ...state.articles];
  }catch(err){
    state.publishError = (err && err.message) || String(err);
  }finally{
    state.publishing = false; render();
  }
}

async function deleteArticle(id){
  const prev = state.articles;
  const article = state.articles.find(a=>a.id===id);
  state.articles = state.articles.filter(a=>a.id!==id);
  render();
  try{
    const client = getTttClient();
    const paths = (article && article.images || []).map(img=>img.path).filter(Boolean);
    if (paths.length) await client.storage.from('azv-news').remove(paths);
    const { error } = await azvNews().delete().eq("id", id);
    if (error) throw error;
  }catch(err){
    // Roll back on failure so the admin isn't shown a deleted-looking
    // article that's actually still in the database.
    state.articles = prev;
    state.deleteError = (err && err.message) || String(err);
    render();
  }
}

  e.preventDefault();

// The stations table has no "city" column — only lat/lon — but every
// TraceTheToxin station name is prefixed with its city ("Beograd Stari

/* =================================================================
   PHOTO COMPRESSION + UPLOAD — canvas-based resize/re-encode, then a
   direct upload to Supabase Storage (bucket "azv-news"). Runs entirely
   in the browser before anything is sent, so large phone photos never
   hit the network at full size.
================================================================= */
function compressImageFile(file, { maxDim = 1600, quality = 0.75 } = {}){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim){ height = Math.round(height*(maxDim/width)); width = maxDim; }
      else if (height > maxDim){ width = Math.round(width*(maxDim/height)); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => blob ? resolve({ blob, width, height }) : reject(new Error('Compression failed')), 'image/jpeg', quality);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadArticlePhotos(articleId, files){
  const client = getTttClient();
  const images = [];
  for (let i=0; i<files.length; i++){
    const { blob, width, height } = await compressImageFile(files[i]);
    const path = `news/${articleId}/${i}-${Date.now()}.jpg`;
    const { error } = await client.storage.from('azv-news').upload(path, blob, { contentType:'image/jpeg', upsert:false });
    if (error) throw error;
    const { data: pub } = client.storage.from('azv-news').getPublicUrl(path);
    images.push({ url: pub.publicUrl, path, width, height });
  }
  return images;
}

async function loadLiveStations(){
  const client = getTttClient();
  if (!client) throw new Error("Supabase client unavailable");
  const [{ data: stations, error: stErr }, { data: latest, error: rdErr }] = await Promise.all([
    client.from("air_quality_stations").select("*"),
    client.from("air_quality_latest").select("*"),
  ]);
  if (stErr) throw stErr;
  if (rdErr) console.error("TraceTheToxin latest-reading load error:", rdErr);
  if (!stations || !stations.length) throw new Error("No stations returned");

  const readingByStation = {};
  (latest || []).forEach(r=>{ readingByStation[r.station_id] = r; });

  const live = stations.map(s=>{
    const r = readingByStation[s.id] || null;
    return {
      id: s.id, name: s.name, city: deriveCityFromName(s.name), lat: s.lat, lon: s.lon,
      sepaCategory: r ? r.category : null,
      pm25: r ? r.pm25 : null, pm10: r ? r.pm10 : null,
      so2: r ? r.so2 : null, no2: r ? r.no2 : null, o3: r ? r.o3 : null,
      recordedAt: r ? r.recorded_at : null,
    };
  });
  return live;
}

  `;
}

/* =================================================================
   INIT — load persisted data, then attempt a live AQI source
================================================================= */
(async function init(){
  await restoreAdminSession();
  try{
    const loaded = await loadArticlesFromSupabase();
    // Only replace the seed articles if Supabase actually has rows —
    // an empty (freshly-migrated) table shouldn't wipe out the seed news.
    if (loaded.length) state.articles = loaded;
  }catch(e){
    console.error("Article load from Supabase failed, using seed data:", e);
    state.articlesLoadError = (e && e.message) || String(e);
  }
  render();

  // Live station attempt — reads TraceTheToxin's own Supabase tables;
  // falls back to the baked-in demo dataset on any failure.
  try{
    const live = await loadLiveStations();
    STATIONS = live;
    const noviSadStation = live.find(s=>s.city==="Novi Sad");
    state.stationId = (noviSadStation || live[0]).id;
    state.liveMode = true;
  }catch(e){
    console.error("Live station load failed, using demo data:", e);
    state.liveError = (e && (e.message || e.error_description || e.hint || JSON.stringify(e))) || String(e);
    STATIONS = DEMO_STATIONS;
    state.liveMode = false;
  }finally{
    state.loadingLive = false;
    render();
  }
})();
