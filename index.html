<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alarm za vazduh</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans:wght@400;700&display=swap');
  :root{
    --ink:#132029; --paper:#ECEDE8; --accent:#3E7C8C; --line:#D3D2C8;
    --muted:#5B6B70; --muted2:#8B968B; --text2:#33454B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'PT Sans',Arial,sans-serif;background:var(--paper);color:var(--ink);}
  .serif{font-family:'PT Serif',Georgia,serif;}
  .tabular{font-variant-numeric:tabular-nums;}
  button, input, textarea, select{font-family:inherit;}
  a{color:inherit;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;}
  .wrap-narrow{max-width:760px;margin:0 auto;padding:0 20px;}
  .wrap-report{max-width:620px;margin:0 auto;padding:0 20px;}
  .wrap-admin{max-width:900px;margin:0 auto;padding:0 20px;}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:700;border:none;}
  .btn-ink{background:var(--ink);color:var(--paper);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .field{padding:9px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;width:100%;}
  .icon{display:inline-flex;vertical-align:middle;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  header.topbar{border-bottom:1px solid var(--line);}
  .topbar-inner{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;padding:0;}
  .brand-name{font-size:20px;font-weight:700;color:var(--ink);}
  .navgroup{display:flex;align-items:center;gap:16px;font-size:14px;flex-wrap:wrap;}
  nav.tabs{display:flex;gap:14px;}
  nav.tabs button{background:none;border:none;cursor:pointer;padding:4px 0;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;}
  nav.tabs button.active{color:var(--ink);font-weight:700;border-bottom:2px solid var(--accent);}
  .langbox{display:flex;align-items:center;gap:4px;border-left:1px solid var(--line);padding-left:14px;}
  .langbox button{background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted2);padding:2px 4px;}
  .langbox button.active{font-weight:700;color:var(--ink);}
  .adminbtn{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border:none;border-radius:3px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:700;}
  .dash{background:var(--ink);color:var(--paper);}
  .dash-inner{padding:36px 20px 30px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:24px;}
  .dash-selects{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .dash-selects select{background:transparent;color:var(--paper);border:none;font-size:15px;font-weight:700;cursor:pointer;}
  .dash-selects select.station{color:#C7D1D3;border:1px solid #33454B;border-radius:3px;font-size:13px;padding:2px 6px;}
  .dash-selects select option{color:var(--ink);}
  .aqi-num{font-size:84px;font-weight:700;line-height:1;}
  .aqi-cat{font-size:15px;font-weight:700;margin-top:4px;}
  .advisory{max-width:380px;font-size:14px;line-height:1.5;color:#C7D1D3;margin-top:12px;}
  .pollutant-row{display:flex;gap:20px;margin-top:16px;font-size:13px;}
  .live-badge{margin-top:18px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#93A3A6;border:1px solid #33454B;border-radius:3px;padding:4px 8px;}
  .other-stations{min-width:280px;max-height:320px;overflow-y:auto;padding-right:10px;}
  .other-stations .oh{font-size:12px;letter-spacing:.3px;color:#93A3A6;margin-bottom:10px;}
  .other-stations .cityhead{font-size:11px;color:#5B6B70;margin:8px 0 4px;}
  .other-stations button{display:flex;align-items:center;justify-content:space-between;gap:16px;background:none;border:none;border-bottom:1px solid #26363C;padding:5px 0;cursor:pointer;color:var(--paper);width:100%;text-align:left;}
  .other-stations button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .other-stations button span:last-child{font-weight:700;flex-shrink:0;}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;padding:36px 20px 60px;}
  @media(max-width:700px){.grid2{grid-template-columns:1fr;} .dash-inner{flex-direction:column;}}
  .sectionhead{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:0;margin-bottom:16px;}
  .sectionhead span.txt{font-size:20px;font-weight:700;color:var(--ink);}
  .article-row{border-bottom:1px solid var(--line);padding:14px 0;}
  .article-date{font-size:12px;color:var(--muted2);margin-bottom:4px;}
  .article-title{font-weight:700;margin-bottom:6px;line-height:1.3;}
  .article-title.compact{font-size:16px;}
  .article-title.full{font-size:20px;}
  .article-excerpt{font-size:14px;color:var(--text2);line-height:1.5;}
  .readmore{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:8px 0 0;font-weight:700;}
  .article-body{font-size:14px;line-height:1.6;color:var(--text2);margin-top:8px;}
  .pollutant-mini{border-bottom:1px solid var(--line);padding:10px 0;}
  .pollutant-mini .n{font-weight:700;font-size:14px;}
  .pollutant-mini .d{font-size:13px;color:#4B575C;}
  .newsletter-box{margin-top:24px;border:1px solid var(--line);padding:16px;border-radius:3px;}
  .newsletter-box .t{font-weight:700;font-size:14px;margin-bottom:8px;}
  .glossary-item{border-bottom:1px solid var(--line);}
  .glossary-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;cursor:pointer;padding:16px 0;text-align:left;}
  .glossary-head .n{font-size:19px;font-weight:700;color:var(--ink);}
  .glossary-body{padding-bottom:18px;font-size:14px;line-height:1.6;color:var(--text2);}
  .chev{transition:transform .15s;}
  .chev.open{transform:rotate(180deg);}
  .industrial-item{border-bottom:1px solid var(--line);padding:14px 0;}
  .industrial-item .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .industrial-item .name{font-weight:700;font-size:15px;}
  .industrial-item .place{font-size:12px;color:var(--muted2);}
  .industrial-item .desc{font-size:13.5px;color:var(--text2);margin-top:4px;line-height:1.5;}
  .report-card{border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:30px;}
  .report-card .t{font-weight:700;font-size:15px;margin-bottom:4px;}
  .report-card .d{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .or-divider{font-size:13px;color:var(--muted2);margin-bottom:16px;}
  .form-col{display:flex;flex-direction:column;gap:10px;}
  .label{font-size:13px;color:var(--muted);display:block;}
  .label input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;}
  .error-text{color:#C1483B;font-size:13px;}
  .admin-empty{max-width:500px;margin:0 auto;padding:60px 20px;text-align:center;color:var(--muted);}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  @media(max-width:700px){.admin-grid{grid-template-columns:1fr;}}
  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{padding:4px 0;text-align:left;}
  table.data thead tr{border-bottom:1px solid var(--line);color:var(--muted);position:sticky;top:0;background:var(--paper);}
  table.data tbody tr{border-bottom:1px solid var(--line);}
  table.data td{padding:6px 0;}
  .manage-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;}
  .manage-row .tt{font-weight:700;font-size:14px;}
  .manage-row .dd{font-size:12px;color:var(--muted2);}
  .del-btn{background:none;border:none;cursor:pointer;color:#C1483B;}
  footer.foot{border-top:1px solid var(--line);padding:20px;text-align:center;font-size:12px;color:var(--muted2);}
</style>
</head>

// Maps TraceTheToxin's real SEPA-style station categories to our own
// good/moderate/.../hazardous keys (by severity rank) — used only to pick
// the marker color and the advisory paragraph's severity tier. The visible
// headline uses SEPA_LABELS below instead, so we never show our own
// US-AQI-style wording ("unhealthy for sensitive groups") next to a
// reading that's actually on Serbia's DOBAR..IZUZETNO ZAGAĐEN scale.
const SEPA_TO_KEY = {
  "DOBAR":"good", "PRIHVATLJIV":"moderate", "UMEREN":"usg",
  "ZAGAĐEN":"unhealthy", "VEOMA ZAGAĐEN":"vunhealthy", "IZUZETNO ZAGAĐEN":"hazardous",
};
const SEPA_LABELS = {
  "DOBAR":            {"sr-latn":"Dobar",            "sr-cyrl":"Добар",             en:"Good"},
  "PRIHVATLJIV":      {"sr-latn":"Prihvatljiv",       "sr-cyrl":"Прихватљив",        en:"Acceptable"},
  "UMEREN":           {"sr-latn":"Umeren",            "sr-cyrl":"Умерен",            en:"Moderate"},
  "ZAGAĐEN":          {"sr-latn":"Zagađen",           "sr-cyrl":"Загађен",           en:"Polluted"},
  "VEOMA ZAGAĐEN":    {"sr-latn":"Veoma zagađen",     "sr-cyrl":"Веома загађен",     en:"Very polluted"},
  "IZUZETNO ZAGAĐEN": {"sr-latn":"Izuzetno zagađen",  "sr-cyrl":"Изузетно загађен",  en:"Extremely polluted"},
};
function sepaLabel(cat){ return (SEPA_LABELS[cat] && SEPA_LABELS[cat][state.lang]) || cat || "–"; }
function fmtNum(n){
  if (n==null || isNaN(n)) return "–";
  const rounded = Math.round(n*10)/10;
  const str = rounded.toString();
  return state.lang==="en" ? str : str.replace(".", ",");
}
function levelForKey(key){ return AQI_LEVELS.find(l=>l.key===key) || AQI_LEVELS[0]; }
// Demo stations use a numeric 0-500 style AQI; live TraceTheToxin stations
// carry a SEPA category string instead (no numeric score). This handles both.
function levelFor(station){
  if (station.sepaCategory) return levelForKey(SEPA_TO_KEY[station.sepaCategory] || "good");
  return AQI_LEVELS.find(l=>station.aqi<=l.max) || AQI_LEVELS[AQI_LEVELS.length-1];
}
function formatStationTime(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* =================================================================
   STORAGE — uses window.storage when previewing in Claude,
   falls back to localStorage on a real deployed server.
   NOTE: localStorage is per-browser only. For real shared/admin-wide
   persistence in production, replace this with a real backend/database.
================================================================= */
async function storageGet(key, shared){
  try{
    if (window.storage) return await window.storage.get(key, !!shared);
  }catch(e){ /* not found or unavailable */ }
  try{
    const v = localStorage.getItem(key);
    return v ? {value:v} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  try{
    if (window.storage){ await window.storage.set(key, value, !!shared); return; }
  }catch(e){}
  try{ localStorage.setItem(key, value); }catch(e){}
}

/* =================================================================
   TRACETHETOXIN LIVE STATIONS
   Same Supabase project TraceTheToxin itself reads from — its station
   network (air_quality_stations + air_quality_latest) is the real data
   source, this app just displays it. Falls back to DEMO_STATIONS if the
   fetch fails for any reason (offline, table renamed, etc.).
================================================================= */
const TTT_SUPABASE_URL = "https://fnkqmwweljsupbmerbkh.supabase.co";
const TTT_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZua3Ftd3dlbGpzdXBibWVyYmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3OTcwODUsImV4cCI6MjA5NzM3MzA4NX0.eX3mxnSpGmJ6Ebw7Y4F_jHiJarPH4ri9WNYXwmLi16I";
let tttClient = null;
function getTttClient(){
  if (!tttClient && window.supabase) tttClient = window.supabase.createClient(TTT_SUPABASE_URL, TTT_SUPABASE_KEY);
  return tttClient;
}

// The stations table has no "city" column — only lat/lon — but every
// TraceTheToxin station name is prefixed with its city ("Beograd Stari
// grad", "Novi Sad Liman" ...), so city is derived instantly and
// synchronously from the name instead of round-tripping to a reverse
// geocoding service per station. That earlier approach was slow (~1s/
// station, rate-limited), showed a placeholder "Other stations" bucket
// in the city dropdown until it finished, and forced a re-render after
// every station that could interrupt an open dropdown mid-selection.
const KNOWN_CITIES = [
  "Sremska Mitrovica","Novi Sad","Kragujevac","Zrenjanin","Kraljevo","Kostolac",
  "Smederevo","Subotica","Valjevo","Leskovac","Loznica","Zaječar","Pančevo",
  "Beograd","Beočin","Sombor","Vršac","Šabac","Čačak","Niš","Bor",
].sort((a,b)=>b.length-a.length);
function deriveCityFromName(name){
  const found = KNOWN_CITIES.find(c=>name && name.startsWith(c));
  return found || null;
}

async function loadLiveStations(){
  const client = getTttClient();
  if (!client) throw new Error("Supabase client unavailable");
  const [{ data: stations, error: stErr }, { data: latest, error: rdErr }] = await Promise.all([
    client.from("air_quality_stations").select("*"),
    client.from("air_quality_latest").select("*"),
  ]);
  if (stErr) throw stErr;
  if (rdErr) console.error("TraceTheToxin latest-reading load error:", rdErr);
  if (!stations || !stations.length) throw new Error("No stations returned");

  const readingByStation = {};
  (latest || []).forEach(r=>{ readingByStation[r.station_id] = r; });

  const live = stations.map(s=>{
    const r = readingByStation[s.id] || null;
    return {
      id: s.id, name: s.name, city: deriveCityFromName(s.name), lat: s.lat, lon: s.lon,
      sepaCategory: r ? r.category : null,
      pm25: r ? r.pm25 : null, pm10: r ? r.pm10 : null,
      so2: r ? r.so2 : null, no2: r ? r.no2 : null, o3: r ? r.o3 : null,
      recordedAt: r ? r.recorded_at : null,
    };
  });
  return live;
}

function render(){
  const T_=t();

  if (state.view==="home") body = renderHome();

  else if (state.view==="admin-login") body = renderAdminLogin();

  document.getElementById("app").innerHTML = `
    ${renderHeader()}
    ${body}
    <footer class="foot">${T_.footer_note}</footer>
  `;
}

/* =================================================================
   INIT — load persisted data, then attempt a live AQI source
================================================================= */
(async function init(){
  try{
    const res = await storageGet("az:articles", true);
    if (res && res.value){
      const parsed = JSON.parse(res.value);
      if (Array.isArray(parsed) && parsed.length) state.articles = parsed;
    }
  }catch(e){}
  render();

  // Live station attempt — reads TraceTheToxin's own Supabase tables;
  // falls back to the baked-in demo dataset on any failure.
  try{
    const live = await loadLiveStations();
    STATIONS = live;
    state.stationId = live[0].id;
    state.liveMode = true;
  }catch(e){
    console.error("Live station load failed, using demo data:", e);
    state.liveError = (e && (e.message || e.error_description || e.hint || JSON.stringify(e))) || String(e);
    STATIONS = DEMO_STATIONS;
    state.liveMode = false;
  }finally{
    state.loadingLive = false;
    render();
  }
})();
</script>
